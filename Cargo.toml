[package]
name = "crawlingo"
version = "1.0.0-alpha.1"
edition = "2021"
license = "MIT"
description = "Next-generation web data extraction, crawling, and website monitoring framework."
repository = "https://github.com/Vamshavardhan50/crawlingo"
homepage = "https://crawlingo-docs.vercel.app"
documentation = "https://crawlingo-docs.vercel.app"
exclude = [
    "sdk/",
    "crawlingo-docs/",
    "archive/",
    "assets/",
    "waitlist/"
]

[package.metadata.funding]
url = "https://github.com/sponsors/Vamshavardhan50"

[lib]
name = "crawlingo"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "crawlingo"
path = "src/bin/crawlingo.rs"
required-features = ["cli"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "time", "slab"] }
futures = "0.3"

# HTTP/Stealth client (wreq is the successor of rquest)
wreq = { version = "6.0.0-rc.29", features = ["cookies", "stream", "json", "socks", "hickory-dns"] }
wreq-util = "3.0.0-rc.12"

# HTML parsing
lol_html = "2.0"

# HTTP client-pool cache (fetcher.rs) and response caching
moka = { version = "0.12", features = ["future"] }

# Concurrency & Lock-free
dashmap = "5.5"

# Rate Limiter
governor = "0.6"

# Similarity algorithms
strsim = "0.11"

# Fingerprint storage
sled = "0.34"
bincode = "1.3"

# Parallelism
rayon = "1.10"

# Zero-copy & SIMD
bytes = "1.6"
memchr = "2.7"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# Basic-auth header encoding
base64 = "0.22"

# Selectors cache
once_cell = "1.19"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Config file parsing (does not pull `time`, safe alongside the pin below)
toml = "0.8"

# Export backends
csv = "1.3"
arrow = { version = "51" }
parquet = { version = "51", features = ["arrow"] }

# Utilities
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1.10"
url = "2.5"
chrono = { version = "=0.4.38", features = ["serde"] }
flate2 = "1.0"
# Pin time to avoid API breakage in cookie 0.18.1 (time >=0.3.52 changed parse() signature)
time = ">=0.3, <0.3.52"

# Python bindings
pyo3 = { version = "0.23", features = ["extension-module", "py-clone"], optional = true }

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"], optional = true }

[features]
default = []
python = ["pyo3"]
cli = ["clap"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"
tempfile = "3"
