name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# ─────────────────────────────────────────────────────────────────────────────
#  JOBS
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Version consistency ─────────────────────────────────────────────────
  version-check:
    name: 🔢 Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify all SDK versions match Cargo.toml
        shell: bash
        run: |
          cargo_ver=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          python_ver=$(grep '^version' sdk/python/pyproject.toml 2>/dev/null | head -1 | cut -d'"' -f2 || echo "SKIP")
          node_ver=$(node -e "console.log(require('./sdk/nodejs/package.json').version)" 2>/dev/null || echo "SKIP")

          echo "Cargo:   $cargo_ver"
          echo "Python:  $python_ver"
          echo "Node.js: $node_ver"

          # Normalize python version if it contains PEP 440 prerelease format
          python_norm=$(echo "$python_ver" | sed -e 's/a\([0-9]\)/-alpha.\1/')

          if [[ "$python_ver" != "SKIP" && "$cargo_ver" != "$python_norm" ]]; then
            echo "::error::Cargo ($cargo_ver) and Python ($python_ver) versions differ"
            exit 1
          fi

          if [[ "$node_ver" != "SKIP" && "$cargo_ver" != "$node_ver" ]]; then
            echo "::error::Cargo ($cargo_ver) and Node.js ($node_ver) versions differ"
            exit 1
          fi

          echo "✓ All versions consistent: $cargo_ver"

  # ── 2. Rust — format / lint / test ────────────────────────────────────────
  rust:
    name: 🦀 Rust • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: version-check

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + components)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ runner.os }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (all features, deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --verbose

      - name: Check documentation
        run: cargo doc --workspace --all-features --no-deps

  # ── 3. Python SDK — build + test ──────────────────────────────────────────
  python:
    name: 🐍 Python ${{ matrix.python }} • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: rust

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Python 3.8 / 3.9 wheels are not supported on Windows arm
          - os: windows-latest
            python: "3.8"
          - os: windows-latest
            python: "3.9"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-python-${{ runner.os }}

      - name: Install maturin
        run: pip install --upgrade pip maturin

      - name: Build + install Python SDK
        working-directory: sdk/python
        run: pip install --no-build-isolation -e ".[dev]"

      - name: Smoke test
        run: python -c "import crawlingo; print('Version:', crawlingo.__version__)"

      - name: Run Python tests
        working-directory: sdk/python
        run: |
          pip install pytest
          pytest tests/ -v --tb=short

  # ── 4. Node.js SDK — build + test ─────────────────────────────────────────
  node:
    name: 📦 Node.js ${{ matrix.node }} • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: rust

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/nodejs/package-lock.json

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-node-${{ runner.os }}

      - name: Install Node.js dependencies
        working-directory: sdk/nodejs
        run: npm ci

      - name: Build native module + TypeScript
        working-directory: sdk/nodejs
        run: |
          npm run build
          npm run build:ts

      - name: Pack dry-run (verify package contents)
        working-directory: sdk/nodejs
        run: npm pack --dry-run

      - name: Run Node.js tests
        working-directory: sdk/nodejs
        run: node tests/test_all.cjs

  # ── 5. Security audit ─────────────────────────────────────────────────────
  audit:
    name: 🔐 Security Audit
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --quiet
      - name: Run cargo audit
        run: cargo audit

  # ── 6. Docs — link check ──────────────────────────────────────────────────
  docs-check:
    name: 📚 Docs Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail '**/*.md'
          fail: false   # warn only — don't block CI on external link rot

  # ── Summary gate (required check for branch protection) ───────────────────
  ci-pass:
    name: ✅ CI Pass
    runs-on: ubuntu-latest
    needs: [rust, python, node, audit]
    if: always()
    steps:
      - name: Evaluate results
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          failed = [k for k, v in data.items() if v['result'] not in ('success', 'skipped')]
          if failed:
              print('::error::Failed jobs:', ', '.join(failed))
              sys.exit(1)
          print('All required jobs passed.')
          "