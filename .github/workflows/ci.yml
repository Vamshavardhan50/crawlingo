name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-release.cjs

  rust:
    name: Rust (${{ matrix.os }})
    needs: version-check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - name: Configure Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib --tests
      - run: cargo check --features cli,browser
      - run: cargo doc --no-deps

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    needs: version-check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-${{ matrix.python }}
      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - name: Configure Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - name: Build and install the source extension
        working-directory: sdk/python
        run: python -m pip install .
      - name: Check installed package and dataset jobs
        run: |
          python -m unittest discover -s sdk/python/tests -p test_import.py -v
          python -m unittest discover -s sdk/python/tests -p test_dataset_job.py -v
      - name: Run the standalone Python API suite
        run: python sdk/python/tests/test_all_apis.py

  node:
    name: Node ${{ matrix.node }} (${{ matrix.os }})
    needs: version-check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '24' }
          - { os: windows-latest, node: '22' }
    defaults:
      run:
        working-directory: sdk/nodejs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/nodejs/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/nodejs/native -> target
      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - name: Configure Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:all
      - run: node --test tests/dataset_job.test.cjs
      - run: npm run check:package
      - run: npm pack --dry-run

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [version-check, rust, python, node, audit]
    if: always()
    steps:
      - name: Require every job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['JOB_RESULTS'])
          failures = [name for name, result in results.items() if result['result'] != 'success']
          if failures:
              print('Required jobs did not succeed:', ', '.join(failures))
              sys.exit(1)
          print('All required jobs passed.')
          PY
