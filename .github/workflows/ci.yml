name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  rust:
    name: Rust • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust Tests
        run: cargo test --workspace --all-features --verbose

  python:
    name: Python • ${{ matrix.python }} • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

        python:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

        exclude:
          - os: windows-latest
            python: "3.9"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install maturin
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin

      - name: Build Python SDK
        working-directory: sdk/python
        run: |
          python -m pip install --no-build-isolation .

      - name: Smoke Test
        run: |
          python -c "import crawlingo; print(crawlingo.__version__)"

      - name: Python SDK Tests
        working-directory: sdk/python
        run: |
          python tests/test_all_apis.py

  node:
    name: Node.js • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/nodejs/package-lock.json

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Dependencies
        working-directory: sdk/nodejs
        run: npm ci

      - name: Build Native Module
        working-directory: sdk/nodejs
        run: |
          npm run build
          npm run build:ts

      - name: Package Check
        working-directory: sdk/nodejs
        run: npm pack --dry-run

      - name: Node SDK Tests
        working-directory: sdk/nodejs
        run: |
          node tests/test_all.cjs

  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify Versions
        shell: bash
        run: |
          cargo_version=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          python_version=$(grep '^version' sdk/python/pyproject.toml | head -1 | cut -d'"' -f2)
          node_version=$(grep '"version"' sdk/nodejs/package.json | head -1 | cut -d'"' -f4)

          echo "Cargo:   $cargo_version"
          echo "Python:  $python_version"
          echo "Node.js: $node_version"

          if [ "$cargo_version" != "$python_version" ]; then
            echo "::error::Cargo and Python versions differ."
            exit 1
          fi

          if [ "$cargo_version" != "$node_version" ]; then
            echo "::error::Cargo and Node.js versions differ."
            exit 1
          fi

          echo "✓ Versions match."