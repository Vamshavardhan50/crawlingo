name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish-npm:
        description: Retry npm publishing for an existing release
        required: false
        type: boolean
        default: false
      release-tag:
        description: Existing release tag to receive the npm package
        required: false
        type: string
        default: v1.0.0-alpha.3

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    needs: verify-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-version.outputs.source-commit }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-audit
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - run: cargo audit --file sdk/nodejs/native/Cargo.lock

  verify-version:
    runs-on: ubuntu-latest
    outputs:
      source-commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish-npm && format('refs/tags/{0}', inputs.release-tag) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin source commit for all build jobs
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: node scripts/check-release.cjs
      - name: Verify retry tag matches package versions
        if: github.event_name == 'workflow_dispatch' && inputs.publish-npm
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: node scripts/check-release.cjs "$RELEASE_TAG"
      - name: Verify release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/check-release.cjs "$RELEASE_TAG"

  test-core:
    needs: [verify-version, audit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-version.outputs.source-commit }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - name: Configure Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: release-core-${{ matrix.os }}
      - run: cargo test --locked --lib --tests
      - run: cargo check --locked --features cli,browser
      - name: Build CLI
        run: cargo build --locked --release --features cli
      - name: Archive CLI and license
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          binary=crawlingo
          if [[ "$RUNNER_OS" == Windows ]]; then binary=crawlingo.exe; fi
          mkdir cli-release
          cp "target/release/$binary" LICENSE cli-release/
          tar -czf "crawlingo-$version-$TARGET.tar.gz" -C cli-release .
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: crawlingo-*.tar.gz
          if-no-files-found: error

  build-node-addons:
    needs: [verify-version, audit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            file: crawlingo-native.linux-x64-gnu.node
          - os: macos-15-intel
            target: x86_64-apple-darwin
            file: crawlingo-native.darwin-x64.node
          - os: macos-15
            target: aarch64-apple-darwin
            file: crawlingo-native.darwin-arm64.node
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            file: crawlingo-native.win32-x64-msvc.node
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-version.outputs.source-commit }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/nodejs/native -> target
          shared-key: release-node-${{ matrix.os }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - name: Configure Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - run: npm ci
        working-directory: sdk/nodejs
      - name: Build host native addon
        working-directory: sdk/nodejs
        run: npx napi build --target ${{ matrix.target }} --platform --release --js src/native.js --dts src/native.d.ts --cargo-cwd native --cargo-flags="--locked" .
      - name: Compile wrapper and stage assets
        working-directory: sdk/nodejs
        run: npm run prepack
      - name: Test compiled package
        working-directory: sdk/nodejs
        run: npm test
      - name: Test dataset jobs and monitoring
        working-directory: sdk/nodejs
        run: node --test tests/dataset_job.test.cjs
      - name: Run implemented API suite
        working-directory: sdk/nodejs
        run: npm run test:all
      - name: Check Debian 12 consumer compatibility
        if: runner.os == 'Linux'
        working-directory: sdk/nodejs
        run: >-
          docker run --rm --mount type=bind,src="$PWD",dst=/package,readonly
          node:22-bookworm-slim
          node --test /package/tests/dataset_job.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: node-addon-${{ matrix.target }}
          path: sdk/nodejs/${{ matrix.file }}
          if-no-files-found: error

  python-wheels:
    needs: [verify-version, audit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archs: x86_64
          - os: ubuntu-24.04-arm
            archs: aarch64
          - os: macos-15-intel
            archs: x86_64
          - os: macos-15
            archs: arm64
          - os: windows-latest
            archs: AMD64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-version.outputs.source-commit }}
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
      - name: Configure Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - uses: pypa/cibuildwheel@v2.21
        with:
          package-dir: sdk/python
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_SKIP: '*-musllinux_*'
          CIBW_TEST_COMMAND: >-
            python "{package}/tests/test_import.py" &&
            python "{package}/tests/test_dataset_job.py"
          CIBW_BEFORE_ALL_LINUX: >-
            curl https://sh.rustup.rs -sSf | sh -s -- -y &&
            (if command -v yum; then yum install -y clang; else apt-get update && apt-get install -y clang libclang-dev; fi)
          CIBW_ENVIRONMENT_LINUX: PATH=/root/.cargo/bin:$PATH MATURIN_NO_INSTALL_RUST=1
          CIBW_ENVIRONMENT_MACOS: PATH=$HOME/.cargo/bin:$PATH MATURIN_NO_INSTALL_RUST=1 MACOSX_DEPLOYMENT_TARGET=10.12
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  package-npm:
    needs: [verify-version, build-node-addons, python-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-version.outputs.source-commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: sdk/nodejs
          pattern: node-addon-*
          merge-multiple: true
      - run: npm ci
        working-directory: sdk/nodejs
      - name: Build and verify distribution
        working-directory: sdk/nodejs
        run: |
          npm run prepack
          node scripts/check-package.cjs --all-platforms
          npm test
          node --test tests/dataset_job.test.cjs
          npm pack --ignore-scripts
      - name: Inspect archive and install into a clean consumer
        shell: bash
        run: |
          version=$(node -p "require('./sdk/nodejs/package.json').version")
          tar -tzf "sdk/nodejs/crawlingo-$version.tgz"
          mkdir npm-consumer
          cd npm-consumer
          npm init -y
          npm install --ignore-scripts "../sdk/nodejs/crawlingo-$version.tgz"
          node -e "if (typeof require('crawlingo').DatasetJob !== 'function') throw Error('Missing DatasetJob')"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: sdk/nodejs/*.tgz
          if-no-files-found: error
  package-python:
    needs: [verify-version, python-wheels, build-node-addons]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-version.outputs.source-commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install maturin twine
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: python-wheels-*
          merge-multiple: true
      - run: maturin sdist --out ../../dist
        working-directory: sdk/python
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  package-crate:
    needs: [verify-version, test-core, build-node-addons, python-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-version.outputs.source-commit }}
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - run: cargo package --locked --list
      - name: Check registry packaging without publishing
        run: cargo publish --locked --dry-run --target-dir target/crate-release
      # Do not rely on publish --dry-run retaining its temporary upload archive.
      - name: Build the distributable crate
        run: cargo package --locked --target-dir target/crate-release
      - name: Stage the verified crate archive
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          crate="target/crate-release/package/crawlingo-$version.crate"
          if [[ ! -s "$crate" ]]; then
            echo "::error::Cargo did not produce the expected nonempty archive: $crate"
            exit 1
          fi
          tar -tzf "$crate" > /dev/null
          mkdir -p crate-dist
          cp "$crate" crate-dist/
          echo "Prepared crate-dist/crawlingo-$version.crate"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-crate
          path: crate-dist/*.crate
          if-no-files-found: error

  rustdoc:
    needs: verify-version
    uses: ./.github/workflows/rustdoc.yml
    with:
      source-ref: ${{ needs.verify-version.outputs.source-commit }}

  release-artifacts:
    needs: [verify-version, package-npm, package-python, package-crate, rustdoc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-version.outputs.source-commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: cli-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: rust-crate
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: rust-docs
          path: release-assets
      - name: Verify complete artifact set and write SHA-256 manifest
        run: node scripts/release-manifest.cjs release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  publish-npm:
    needs: [verify-version, release-artifacts]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish-npm)
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist
      - name: Publish the reviewed tarball
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release-tag }}
          SOURCE_COMMIT: ${{ needs.verify-version.outputs.source-commit }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          tag=latest
          if [[ "$version" == *-* ]]; then tag=next; fi
          archive=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name "crawlingo-$version.tgz" -print -quit)
          if [[ -z "$archive" ]]; then
            echo "::error::npm archive not found for $version"
            find "$GITHUB_WORKSPACE/dist" -maxdepth 2 -type f -print
            exit 1
          fi
          expected="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          metadata="https://registry.npmjs.org/crawlingo/$version"
          status=$(curl -sS -o "$RUNNER_TEMP/npm-version.json" -w '%{http_code}' "$metadata")
          if [[ "$status" == 200 ]]; then
            actual=$(jq -er '.dist.integrity' "$RUNNER_TEMP/npm-version.json")
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Version $version already exists with different bytes. Use a fresh version for changed contents."
              exit 1
            fi
            echo "Registry already contains the reviewed tarball."
            exit 0
          elif [[ "$status" != 404 ]]; then
            echo "::error::npm registry returned HTTP $status while checking $version"
            exit 1
          fi
          if [[ "$SOURCE_COMMIT" == "$GITHUB_SHA" ]]; then
            npm publish "$archive" --provenance --access public --tag "$tag"
          else
            echo "::warning::The workflow commit differs from the checked-out release commit; publishing without npm provenance to avoid an incorrect source attestation."
            npm publish "$archive" --access public --tag "$tag"
          fi
          for delay in 1 2 4 8 16; do
            sleep "$delay"
            if [[ "$(curl -fsS "$metadata" | jq -r '.dist.integrity')" == "$expected" ]]; then exit 0; fi
          done
          echo "::error::Could not verify registry integrity for crawlingo@$version"
          exit 1

  publish-python:
    needs: release-artifacts
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-crate:
    needs: [verify-version, release-artifacts]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-version.outputs.source-commit }}
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - name: Obtain a short-lived crates.io publishing credential
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  attach-release-assets:
    needs: [publish-npm, publish-python, publish-crate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Attach packages, CLI archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/*

  attach-npm-release-assets:
    needs: [publish-npm, release-artifacts]
    if: github.event_name == 'workflow_dispatch' && inputs.publish-npm && needs.publish-npm.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Attach release assets after npm retry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          if [[ -n "$existing" ]]; then
            echo "::warning::Release already has assets; preserving them. Review missing files and checksums before uploading manually."
            exit 0
          fi
          gh release upload "$RELEASE_TAG" release-assets/*
