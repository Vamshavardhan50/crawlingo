name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-audit
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - run: cargo audit --file sdk/nodejs/native/Cargo.lock

  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-release.cjs
      - name: Verify release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/check-release.cjs "$RELEASE_TAG"

  test-core:
    needs: [verify-version, audit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - name: Configure Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --lib --tests
      - run: cargo check --locked --features cli,browser
      - name: Build CLI
        run: cargo build --locked --release --features cli
      - name: Archive CLI and license
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          binary=crawlingo
          if [[ "$RUNNER_OS" == Windows ]]; then binary=crawlingo.exe; fi
          mkdir cli-release
          cp "target/release/$binary" LICENSE cli-release/
          tar -czf "crawlingo-$version-$TARGET.tar.gz" -C cli-release .
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: crawlingo-*.tar.gz
          if-no-files-found: error

  build-node-addons:
    needs: [verify-version, test-core]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            file: crawlingo-native.linux-x64-gnu.node
          - os: macos-15-intel
            target: x86_64-apple-darwin
            file: crawlingo-native.darwin-x64.node
          - os: macos-15
            target: aarch64-apple-darwin
            file: crawlingo-native.darwin-arm64.node
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            file: crawlingo-native.win32-x64-msvc.node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/nodejs/native -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - name: Configure Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - run: npm ci
        working-directory: sdk/nodejs
      - name: Build host native addon
        working-directory: sdk/nodejs
        run: npx napi build --target ${{ matrix.target }} --platform --release --js src/native.js --dts src/native.d.ts --cargo-cwd native --cargo-flags="--locked" .
      - name: Compile wrapper and stage assets
        working-directory: sdk/nodejs
        run: npm run prepack
      - name: Test compiled package
        working-directory: sdk/nodejs
        run: npm test
      - name: Test dataset jobs and monitoring
        working-directory: sdk/nodejs
        run: node --test tests/dataset_job.test.cjs
      - name: Run implemented API suite
        working-directory: sdk/nodejs
        run: npm run test:all
      - uses: actions/upload-artifact@v4
        with:
          name: node-addon-${{ matrix.target }}
          path: sdk/nodejs/${{ matrix.file }}
          if-no-files-found: error

  python-wheels:
    needs: [verify-version, test-core]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archs: x86_64
          - os: ubuntu-24.04-arm
            archs: aarch64
          - os: macos-15-intel
            archs: x86_64
          - os: macos-15
            archs: arm64
          - os: windows-latest
            archs: AMD64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
      - name: Configure Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - uses: pypa/cibuildwheel@v2.21
        with:
          package-dir: sdk/python
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_SKIP: '*-musllinux_*'
          CIBW_TEST_COMMAND: >-
            python {project}/tests/test_import.py &&
            python {project}/tests/test_dataset_job.py
          CIBW_BEFORE_ALL_LINUX: >-
            curl https://sh.rustup.rs -sSf | sh -s -- -y &&
            (if command -v yum; then yum install -y clang; else apt-get update && apt-get install -y clang libclang-dev; fi)
          CIBW_ENVIRONMENT_LINUX: PATH=/root/.cargo/bin:$PATH MATURIN_NO_INSTALL_RUST=1
          CIBW_ENVIRONMENT_MACOS: PATH=$HOME/.cargo/bin:$PATH MATURIN_NO_INSTALL_RUST=1
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  package-npm:
    needs: [build-node-addons, python-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: sdk/nodejs
          pattern: node-addon-*
          merge-multiple: true
      - run: npm ci
        working-directory: sdk/nodejs
      - name: Build and verify distribution
        working-directory: sdk/nodejs
        run: |
          npm run prepack
          node scripts/check-package.cjs --all-platforms
          npm test
          node --test tests/dataset_job.test.cjs
          npm pack --ignore-scripts
      - name: Inspect archive and install into a clean consumer
        shell: bash
        run: |
          version=$(node -p "require('./sdk/nodejs/package.json').version")
          tar -tzf "sdk/nodejs/crawlingo-$version.tgz"
          mkdir npm-consumer
          cd npm-consumer
          npm init -y
          npm install --ignore-scripts "../sdk/nodejs/crawlingo-$version.tgz"
          node -e "if (typeof require('crawlingo').DatasetJob !== 'function') throw Error('Missing DatasetJob')"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: sdk/nodejs/*.tgz
          if-no-files-found: error
  package-python:
    needs: [python-wheels, build-node-addons]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install maturin twine
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: python-wheels-*
          merge-multiple: true
      - run: maturin sdist --out ../../dist
        working-directory: sdk/python
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  package-crate:
    needs: [verify-version, test-core, build-node-addons, python-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - run: cargo package --locked --list
      - run: cargo publish --locked --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: rust-crate
          path: target/package/*.crate
          if-no-files-found: error

  release-artifacts:
    needs: [package-npm, package-python, package-crate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: cli-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: rust-crate
          path: release-assets
      - name: Verify complete artifact set and write SHA-256 manifest
        run: node scripts/release-manifest.cjs release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  publish-npm:
    needs: release-artifacts
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist
      - name: Publish the reviewed tarball with OIDC
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=${RELEASE_TAG#v}
          tag=latest
          if [[ "$version" == *-* ]]; then tag=next; fi
          npm publish "dist/crawlingo-$version.tgz" --provenance --access public --tag "$tag"

  publish-python:
    needs: release-artifacts
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-crate:
    needs: release-artifacts
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - name: Obtain a short-lived crates.io publishing credential
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  attach-release-assets:
    needs: [publish-npm, publish-python, publish-crate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Attach packages, CLI archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/*
