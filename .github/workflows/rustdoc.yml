name: Rust API documentation
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/rustdoc.yml']
  push:
    branches: [main]
    paths: ['src/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/rustdoc.yml']
permissions:
  contents: read
jobs:
  rustdoc:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rustdoc-ubuntu-22
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - name: Build full public Rust reference including optional browser modules
        run: cargo doc --locked --no-deps --lib --features browser
        env:
          RUSTDOCFLAGS: '-D rustdoc::broken_intra_doc_links'
      - name: Package versioned documentation
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p rustdoc-artifacts
          tar -czf "rustdoc-artifacts/crawlingo-$version-rustdoc.tar.gz" -C target doc
      - uses: actions/upload-artifact@v4
        with:
          name: rust-docs
          path: rustdoc-artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 30
