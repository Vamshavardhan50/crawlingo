name: Bug report
description: Report a reproducible engine, SDK or dataset correctness problem.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Include a small reproducible example and remove credentials or private data.
        For a vulnerability, use SECURITY.md instead of a public issue.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Rust engine, Python SDK, Node.js SDK, CLI, Packaging or installation]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit and install source
      placeholder: "Commit SHA / package version; source build, npm, PyPI or crates.io"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, CPU architecture, runtime versions and enabled Cargo features.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Commands, job configuration and a small HTML fixture when possible.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and relevant logs
      description: Include report counters and errors. Say whether this was a fresh run or resume.
      render: text
    validations:
      required: true
